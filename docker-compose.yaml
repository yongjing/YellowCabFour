services:
  api:
    build:
      context: ./yellowcab_api
      dockerfile: Dockerfile
    image: yellowcab-api
    container_name: yellowcab-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    env_file:
      - ./yellowcab_api/.env
    networks:
      - yellowcab-network

  flask:
    build:
      context: ./yellowcab_flask
      dockerfile: Dockerfile
    image: yellowcab-flask
    container_name: yellowcab-flask
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - API_URL=http://api:8000
    env_file:
      - ./yellowcab_flask/.env
    networks:
      - yellowcab-network
    depends_on:
      - api

  streamlit:
    build:
      context: ./yellowcab_streamlit
      dockerfile: Dockerfile
    image: yellowcab-streamlit
    container_name: yellowcab-streamlit
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - API_URL=http://api:8000
    env_file:
      - ./yellowcab_streamlit/.env
    networks:
      - yellowcab-network
    depends_on:
      - api

networks:
  yellowcab-network:
    driver: bridge 