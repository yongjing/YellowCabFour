<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
  <meta name="description" content="">
  <meta name="author" content="">
  <link rel="icon" href="../../favicon.ico">

  <title>Taxi Fare Prediction</title>
  <script>
  function predictTripDuration(event) {
    event.preventDefault();  // prevent refresh

    // get form values
    let PULocationID = document.getElementById("PULocationID").value;
    let DOLocationID = document.getElementById("DOLocationID").value;
    let passenger_count = document.getElementById("passenger_count").value;

    fetch("/prediction/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        PULocationID: PULocationID,
        DOLocationID: DOLocationID,
        passenger_count: passenger_count
      })
    })
    .then(response => response.json())
    .then(data => {
      document.getElementById("result").innerText =
      `Trip Duration Prediction: ${data.trip_duration_prediction} min`;
    })
    .catch(error => console.error("Error:", error));
  }
  </script>
  <!-- Bootstrap core CSS -->
  <link href="/static/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom styles for this template -->
  <link href="/static/css/jumbotron-narrow.css" rel="stylesheet">

</head>

<body>
  <h2 class="text-center">Taxi Fare Prediction</h2>
  <div class="container">
    <div class="jumbotron text-center">
      <h1>Taxi Trip Duration Prediction</h1>
      <form onsubmit="predictTripDuration(event)" class="form-group">
        <div class="mb-3">
          <label for="PULocationID" class="form-label">Pickup Location ID:</label>
          <input type="number" class="form-control" id="PULocationID" name="PULocationID" required>
        </div>

        <div class="mb-3">
          <label for="DOLocationID" class="form-label">Dropoff Location ID:</label>
          <input type="number" class="form-control" id="DOLocationID" name="DOLocationID" required>
        </div>

        <div class="mb-3">
          <label for="passenger_count" class="form-label">Passenger Count:</label>
          <input type="number" class="form-control" id="passenger_count" name="passenger_count" required>
        </div>

        <button type="submit" class="btn btn-success w-100">Predict</button>
      </form>
      <p id="result" class="mt-3 text-primary fs-4"></p>
    </div>
    <footer class="footer">
      <p>&copy; 2025 Vivadata CHEN Yongjing</p>
    </footer>
  </div>
</body>
</html>
